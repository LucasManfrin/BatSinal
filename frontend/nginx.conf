server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API na mesma origem do site: dispensa CORS e funciona por qualquer host (celular, ESP32).
    # DNS interno do Docker com variável: o nginx reencontra a API se o contêiner dela for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas do React Router (/, /c/:slug, /admin/...).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
